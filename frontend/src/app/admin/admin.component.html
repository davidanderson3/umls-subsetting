<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="abbreviation">
    <th mat-header-cell *matHeaderCellDef> Abbreviation </th>
    <td mat-cell *matCellDef="let element"> {{element.abbreviation}} </td>
  </ng-container>

  <ng-container matColumnDef="expandedForm">
    <th mat-header-cell *matHeaderCellDef> Expanded Form </th>
    <td mat-cell *matCellDef="let element"> {{element.expandedForm}} </td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef> Active </th>
    <td mat-cell *matCellDef="let element">
      <mat-checkbox [checked]="element.active" (change)="toggleActive(element)"></mat-checkbox>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
